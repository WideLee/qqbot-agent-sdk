name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # ─── Gate 1: Quality checks must pass before building ───────────────
  quality-gate:
    name: Quality gate (lint + types + tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install project with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src/ tests/

      - name: Mypy (type check)
        run: mypy src/qqbot_agent_sdk

      - name: Pytest (unit tests)
        run: pytest tests/ -v -W error::RuntimeWarning

  # ─── Gate 2: Verify version consistency ──────────────────────────────
  verify-version:
    name: Verify tag matches pyproject version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check version consistency
        run: |
          TAG="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG#v}"
          PROJECT_VERSION=$(python -c "import tomllib; print(tomllib.loads(open('pyproject.toml','rb').read().decode())['project']['version'])")
          IS_PRERELEASE="${{ github.event.release.prerelease }}"
          echo "Release tag version:    $TAG_VERSION"
          echo "pyproject.toml version: $PROJECT_VERSION"
          echo "Is pre-release:         $IS_PRERELEASE"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            if [ "$IS_PRERELEASE" = "true" ]; then
              echo "::warning::Tag version differs from pyproject version (allowed for pre-releases)"
            else
              echo "::error::Release tag ($TAG_VERSION) does not match pyproject.toml version ($PROJECT_VERSION)"
              exit 1
            fi
          fi

  # ─── Build sdist + wheel ─────────────────────────────────────────────
  release-build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs:
      - quality-gate
      - verify-version

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Build release distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: List built artifacts
        run: ls -la dist/

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  # ─── Publish to TestPyPI (for pre-releases) ──────────────────────────
  testpypi-publish:
    name: Publish to TestPyPI
    if: github.event.release.prerelease == true
    runs-on: ubuntu-latest
    needs:
      - release-build

    permissions:
      # IMPORTANT: mandatory for Trusted Publishing (OIDC)
      id-token: write

    environment:
      name: testpypi
      url: https://test.pypi.org/p/qqbot-agent-sdk

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

  # ─── Publish to PyPI (for production releases only) ──────────────────
  pypi-publish:
    name: Publish to PyPI
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    needs:
      - release-build

    permissions:
      # IMPORTANT: mandatory for PyPI Trusted Publishing (OIDC)
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/qqbot-agent-sdk

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qqbot-agent-sdk"
version = "1.2.2"
description = "Standalone QQ Bot (官方机器人) WebSocket + OpenAPI v2 SDK"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "WideLee" },
]
keywords = ["qqbot", "qq-bot", "tencent", "chatbot", "websocket"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]

dependencies = [
    "aiohttp>=3.9",
    "httpx>=0.27",
    "cryptography>=42",
]

[project.optional-dependencies]
audio = [
    "pilk>=0.2",      # QQ silk audio decode
]
qrcode = [
    "qrcode[pil]>=7", # terminal QR rendering for onboard flow
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/tencent-connect/qqbot-agent-sdk"
Repository = "https://github.com/tencent-connect/qqbot-agent-sdk"
Issues = "https://github.com/tencent-connect/qqbot-agent-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/qqbot_agent_sdk"]

[tool.hatch.build.targets.sdist]
exclude = [
    "tests/",
    "examples/",
    ".codebuddy/",
    ".venv/",
    "dist/",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = false

[[tool.mypy.overrides]]
module = "pilk"
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100
